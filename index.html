<!doctype html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>GameVault</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/main.css" />

    <link rel="stylesheet" href="./css/components/navbar.css" />
    <link rel="stylesheet" href="./css/components/cards.css" />
    <link rel="stylesheet" href="./css/components/modal.css" />
    <link rel="stylesheet" href="./css/components/footer.css" />
    <link rel="stylesheet" href="./css/components/loader.css" />

    <link rel="stylesheet" href="./css/utilities/animations.css" />
    <link rel="stylesheet" href="./css/utilities/responsive.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container">
        <a class="navbar-brand logo" href="#"> GameVault </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#"> Inicio </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Favoritos </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header class="hero-section">
      <div class="container hero-content">
        <h1 class="hero-title">Descubre Increibles Videojuegos</h1>

        <p class="hero-text">Explora, busca y guarda tus favoritos juegos.</p>
      </div>
    </header>

    <!-- Main -->
    <main class="container py-5">
      <!-- Search -->
      <section class="search-section mb-5">
        <input
          type="text"
          class="form-control search-input"
          placeholder="Buscar juegos..."
        />
      </section>

      <!-- Games -->

      <div id="loader" class="text-center py-5">
        <div class="spinner-border text-info"></div>
      </div>

      <section id="gamesContainer" class="row g-4"></section>

      <div class="text-center mt-5">
        <button id="loadMoreBtn" class="load-more-btn">
          Cargar más videojuegos
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>GameVault © 2026</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script src="./js/app.js" type="module"></script>

    <div class="modal fade" id="gameModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content custom-modal">
          <div class="modal-header">
            <h5 class="modal-title" id="modalGameTitle">Videojuego</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <img id="modalGameImage" class="img-fluid rounded mb-4" alt="" />

            <p id="modalGameGenre"></p>

            <p id="modalGamePlatform"></p>

            <p id="modalGamePublisher"></p>

            <p id="modalGameDescription"></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
